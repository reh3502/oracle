[workspace]
[package]
name = "oracle-storage-fit"
version = "0.1.0"
edition = "2024"
rust-version = "1.95"
publish = false
[dependencies]
anyhow = "1"
serde = { version = "1", features = ["derive"] }
serde_json = "1"
sha2 = "0.10"
sqlx = { version = "=0.9.0", default-features = false, features = ["runtime-tokio", "sqlite", "postgres"] }
tokio = { version = "1", features = ["macros", "rt-multi-thread", "sync", "time"] }
