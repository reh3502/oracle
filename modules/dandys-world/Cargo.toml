[package]
name = "dandys-world-core"
version = "0.1.0"
edition = "2024"
rust-version = "1.95"
publish = false

[workspace]

[dependencies]
serde = { version = "1", features = ["derive"] }
serde_json = "1"
sha2 = "0.10"
thiserror = "2"
libc = "0.2"
async-trait = "0.1"
oracle-module-sdk = { path = "../../crates/oracle-module-sdk" }
oracle-contracts = { path = "../../crates/oracle-contracts" }
tokio = { version = "1.53.1", features = ["io-std", "io-util", "process", "macros", "rt-multi-thread", "sync", "time"] }

[dev-dependencies]
oracle-rpc = { path = "../../crates/oracle-rpc" }
oracle-core = { path = "../../crates/oracle-core" }
oracle-storage = { path = "../../crates/oracle-storage" }

[[bin]]
name = "dw-query"
path = "src/main.rs"

[[bin]]
name = "dw-module"
path = "src/module.rs"
